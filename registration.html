<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <!-- Add FontAwesome for icons since the design uses them -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Add Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            overflow: hidden;
        }

        /* Page Wrapper for full sky background */
        .page-wrapper {
            width: 100vw;
            height: 100vh;
        }

        /* Brand Header at top-left */
        .brand-header {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ebolt-logo {
            width: 24px;
            height: 24px;
            color: #000; 
        }

        .brand-name {
            font-size: 20px;
            font-weight: 600;
            color: #000;
        }

        /* Content Wrapper for centralizing the card */
        .content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Card Style */
        .form-card {
            background: linear-gradient(135deg, rgba(230, 245, 255, 0.6) 0%, rgba(255, 255, 255, 0.7) 30%, rgba(255, 245, 255, 0.6) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            border-radius: 24px;
            width: 420px;
            max-width: 100%;
            padding: 40px 35px;
            box-shadow: 0 15px 30px rgba(100, 200, 255, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Add light glow around the card */
        .form-card::after {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: linear-gradient(135deg, #e6f5ff 0%, #fff 50%, #fff5ff 100%);
            border-radius: 35px;
            filter: blur(40px);
            opacity: 0.5;
            z-index: -1;
        }

        /* Card Content Styles */
        .header-icon {
            font-size: 36px;
            color: #000;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 14px;
            color: #666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 30px;
            max-width: 90%;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Input Fields and Icons */
        .input-group {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
            font-size: 16px;
        }

        .prefix-icon {
            left: 18px;
        }

        .suffix-icon {
            right: 18px;
            pointer-events: auto;
            cursor: pointer;
        }

        .suffix-icon:hover {
            color: #555;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 14px;
            color: #333;
            background-color: rgba(245, 245, 245, 0.7);
            transition: border-color 0.3s, background-color 0.3s;
        }

        .password-group input {
            padding-right: 50px;
        }

        input:focus {
            outline: none;
            border-color: #5eacff;
            background-color: #fff;
        }

        input::placeholder {
            color: #aaa;
        }

        /* Sign in link */
        .signin-link {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .signin-link a {
            font-size: 13px;
            color: #5eacff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .signin-link a:hover {
            color: #007bff;
        }

        /* Primary Button */
        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1f2a3c 0%, #151e2b 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #2a384f 0%, #1a2536 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
       
        <main class="content-wrapper">
            <div class="form-card">
                <div class="header-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="card-title">Create an Account</h1>
                <p class="card-description">Join us today to bring your words, data, and teams together. For free</p>
                
                <form id="signup-form">
                    <div class="input-group">
                        <i class="fas fa-user input-icon prefix-icon"></i>
                        <input type="text" id="fullname" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon prefix-icon"></i>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="input-group password-group">
                        <i class="fas fa-lock input-icon prefix-icon"></i>
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-eye input-icon suffix-icon" id="password-toggle"></i>
                    </div>
                    <div class="input-group password-group">
                        <i class="fas fa-lock input-icon prefix-icon"></i>
                        <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                        <i class="fas fa-eye input-icon suffix-icon" id="confirm-password-toggle"></i>
                    </div>
                    <button type="submit" class="submit-btn">Sign Up</button>
                </form>

                <div class="signin-link">
                    <span style="font-size: 13px; color: #666;">Already have an account? </span><a href="login.html">Sign in</a>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCi1fyYVp1X41gB0H1YI9JfunLIj2hnAJs",
            authDomain: "login-auth-d6a48.firebaseapp.com",
            projectId: "login-auth-d6a48",
            storageBucket: "login-auth-d6a48.firebasestorage.app",
            messagingSenderId: "28705543487",
            appId: "1:28705543487:web:c63037013ccc8edf72ef8a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Functionality to toggle password visibility
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('password-toggle');
            
            const confirmPasswordInput = document.getElementById('confirm-password');
            const confirmPasswordToggle = document.getElementById('confirm-password-toggle');

            function togglePassword(input, icon) {
                // Toggle input type
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                
                // Toggle icon class (eye / eye-slash)
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            }

            passwordToggle.addEventListener('click', () => togglePassword(passwordInput, passwordToggle));
            confirmPasswordToggle.addEventListener('click', () => togglePassword(confirmPasswordInput, confirmPasswordToggle));

            // Firebase form submission
            const form = document.getElementById('signup-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('fullname').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }

                try {
                    // Create user with Firebase
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    
                    // Update user profile with their name
                    await updateProfile(userCredential.user, {
                        displayName: name
                    });

                    alert('Registration successful! Welcome ' + name);
                    // Redirect to login page after successful registration
                    window.location.href = 'login.html';
                } catch (error) {
                    alert('Registration failed: ' + error.message);
                }
            });
        });
    </script>
</body>
</html>
