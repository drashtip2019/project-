<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Contact Us</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

background:
radial-gradient(circle at top left,#6366F1 0%,transparent 35%),
radial-gradient(circle at bottom right,#06B6D4 0%,transparent 35%),
linear-gradient(135deg,#EEF2FF,#F8FAFC);

}

/*========================*/

.container{

width:100%;

max-width:1100px;

display:grid;

grid-template-columns:420px 1fr;

background:rgba(255,255,255,.82);

backdrop-filter:blur(18px);

border-radius:25px;

overflow:hidden;

box-shadow:0 25px 70px rgba(0,0,0,.15);

border:1px solid rgba(255,255,255,.4);

animation:fade .8s ease;

}

/*========================*/

.left{

position:relative;

background:linear-gradient(145deg,#4338CA,#2563EB,#0891B2);

padding:60px 45px;

color:#fff;

overflow:hidden;

}

.left::before{

content:"";

position:absolute;

width:300px;

height:320px;

background:rgba(255,255,255,.08);

border-radius:50%;

top:-120px;

right:-120px;

}

.left::after{

content:"";

position:absolute;

width:220px;

height:220px;

background:rgba(255,255,255,.05);

border-radius:50%;

bottom:-80px;

left:-80px;

}

.left h1{

font-size:42px;

font-weight:800;

margin-bottom:20px;

position:relative;

z-index:2;

}

.left p{

font-size:16px;

line-height:1.8;

margin-bottom:35px;

opacity:.92;

position:relative;

z-index:2;

}

.info{

background:rgba(255,255,255,.12);

padding:18px;

border-radius:15px;

margin-bottom:18px;

display:flex;

gap:15px;

align-items:center;

transition:.3s;

position:relative;

z-index:2;

}

.info:hover{

transform:translateX(8px);

background:rgba(255,255,255,.18);

}

.icon{

width:50px;

height:50px;

background:#fff;

color:#2563EB;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:20px;

flex-shrink:0;

}

.info h3{

margin-bottom:4px;

font-size:17px;

}

.info p{

margin:0;

font-size:15px;

opacity:.9;

}

.social{

margin-top:30px;

display:flex;

gap:12px;

position:relative;

z-index:2;

}

.social a{

width:48px;

height:48px;

border-radius:50%;

background:rgba(255,255,255,.15);

display:flex;

justify-content:center;

align-items:center;

color:white;

text-decoration:none;

font-size:18px;

transition:.35s;

}

.social a:hover{

background:#fff;

color:#2563EB;

transform:translateY(-6px) scale(1.08);

}

/*========================*/

.right{

padding:60px;

background:white;

}

.right h2{

font-size:36px;

color:#111827;

margin-bottom:35px;

font-weight:800;

}

.form-group{

margin-bottom:20px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

font-weight:600;

color:#475569;

}

input,
textarea{

width:100%;

padding:16px;

border-radius:14px;

border:1px solid #E2E8F0;

background:#F8FAFC;

font-size:15px;

transition:.3s;

outline:none;

}

input:focus,
textarea:focus{

border-color:#4F46E5;

background:#fff;

box-shadow:0 0 0 5px rgba(79,70,229,.15);

}

textarea{

height:150px;

resize:none;

}

button{

width:100%;

padding:17px;

border:none;

border-radius:14px;

background:linear-gradient(135deg,#4F46E5,#2563EB);

color:#fff;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.35s;

}

button:hover{

transform:translateY(-4px);

box-shadow:0 20px 35px rgba(79,70,229,.35);

}

/*========================*/

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/*========================*/

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

.left{

text-align:center;

padding:50px 30px;

}

.info{

text-align:left;

}

.social{

justify-content:center;

}

.right{

padding:40px 25px;

}

.left h1{

font-size:34px;

}

.right h2{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>Contact Us</h1>

<p>
Have questions or need assistance? We'd love to hear from you.
Send us a message and our team will get back to you as soon as possible.
</p>

<div class="info">

<div class="icon">
<i class="fas fa-location-dot"></i>
</div>

<div>

<h3>Address</h3>

<p>Vadodra, Gujarat, India</p>

</div>

</div>

<div class="info">

<div class="icon">
<i class="fas fa-phone"></i>
</div>

<div>

<h3>Phone</h3>

<p>+91 98765 43210 </p>

</div>

</div>

<div class="info">

<div class="icon">
<i class="fas fa-envelope"></i>
</div>

<div>

<h3>Email</h3>

<p>vogueswear.com.in</p>

</div>

</div>

<div class="social">

<a href="#"><i class="fab fa-facebook-f"></i></a>

<a href="#"><i class="fab fa-x-twitter"></i></a>

<a href="#"><i class="fab fa-instagram"></i></a>

<a href="#"><i class="fab fa-linkedin-in"></i></a>

</div>

</div>

<div class="right">

<h2>Send Message</h2>

<form>

<div class="form-group">

<label>Full Name</label>

<input type="text" placeholder="Enter your full name" required>

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" placeholder="Enter your email address" required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="tel" placeholder="Enter your phone number">

</div>

<div class="form-group">

<label>Subject</label>

<input type="text" placeholder="Enter subject">

</div>

<div class="form-group">

<label>Your Message</label>

<textarea placeholder="Write your message..." required></textarea>

</div>

<button type="submit">
<i class="fas fa-paper-plane"></i> Send Message
</button>

</form>

</div>

</div>

</body>
</html>
