<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            overflow: hidden;
        }

        /* Page Wrapper for full sky background */
        .page-wrapper {
            width: 100vw;
            height: 100vh;
        }

        /* Brand Header at top-left */
        .brand-header {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ebolt-logo {
            width: 24px;
            height: 24px;
            color: #000; 
        }

        .brand-name {
            font-size: 20px;
            font-weight: 600;
            color: #000;
        }

        /* Content Wrapper for centralizing the card */
        .content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Card Style */
        .form-card {
            background: linear-gradient(135deg, rgba(230, 245, 255, 0.6) 0%, rgba(255, 255, 255, 0.7) 30%, rgba(255, 245, 255, 0.6) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            border-radius: 24px;
            width: 420px;
            max-width: 100%;
            padding: 40px 35px;
            box-shadow: 0 15px 30px rgba(100, 200, 255, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Add light glow around the card */
        .form-card::after {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: linear-gradient(135deg, #e6f5ff 0%, #fff 50%, #fff5ff 100%);
            border-radius: 35px;
            filter: blur(40px);
            opacity: 0.5;
            z-index: -1;
        }

        /* Card Content Styles */
        .header-icon {
            font-size: 36px;
            color: #000;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 14px;
            color: #666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 30px;
            max-width: 90%;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Input Fields and Icons */
        .input-group {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
            font-size: 16px;
        }

        .prefix-icon {
            left: 18px;
        }

        .suffix-icon {
            right: 18px;
            pointer-events: auto;
            cursor: pointer;
        }

        .suffix-icon:hover {
            color: #555;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 14px;
            color: #333;
            background-color: rgba(245, 245, 245, 0.7);
            transition: border-color 0.3s, background-color 0.3s;
        }

        .password-group input {
            padding-right: 50px;
        }

        input:focus {
            outline: none;
            border-color: #5eacff;
            background-color: #fff;
        }

        input::placeholder {
            color: #aaa;
        }

        /* Forgot Password Link */
        .forgot-password-link {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 25px;
        }

        .forgot-password-link a {
            font-size: 13px;
            color: #5eacff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password-link a:hover {
            color: #007bff;
        }

        /* Sign up link */
        .signup-link {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .signup-link a {
            font-size: 13px;
            color: #5eacff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #007bff;
        }

        /* Primary Button */
        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1f2a3c 0%, #151e2b 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #2a384f 0%, #1a2536 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Divider with text */
        .divider {
            width: 100%;
            text-align: center;
            position: relative;
            margin-bottom: 25px;
        }

        .divider span {
            font-size: 13px;
            color: #aaa;
            background: transparent;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(to right, #ddd, #ddd 1px, transparent 1px, transparent 3px);
            z-index: 0;
        }

        /* Social Signin Buttons */
        .social-signin-group {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 70px;
            height: 48px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .social-btn:hover {
            transform: scale(1.05);
            background-color: #f9f9f9;
        }

        .google-btn i { color: #db4437; }
        .facebook-btn i { color: #1877f2; }
        .apple-btn i { color: #000; }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <a href="index.html" class="brand-header" style="text-decoration: none;">
            <i class="fas fa-arrow-left" style="color: #000; font-size: 20px;"></i>
            <span class="brand-name">Back to Home</span>
        </a>
        <main class="content-wrapper">
            <div class="form-card">
                <div class="header-icon">
                    <i class="fas fa-hand-point-right"></i>
                </div>
                <h1 class="card-title">Sign in with email</h1>
                <p class="card-description">Make a new doc to bring your words, data, and teams together. For free</p>
                
                <form id="signin-form">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon prefix-icon"></i>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="input-group password-group">
                        <i class="fas fa-lock input-icon prefix-icon"></i>
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-eye input-icon suffix-icon" id="password-toggle"></i>
                    </div>
                    <div class="forgot-password-link">
                        <a href="forgot_password.htm">Forgot password?</a>
                    </div>
                    <button type="submit" class="submit-btn">Get Started</button>
                </form>

                <div class="signup-link">
                    <span style="font-size: 13px; color: #666;">Don't have an account? </span><a href="registration.html">Sign up</a>
                </div>

                <!-- <div class="divider">
                    <span>Or sign in with</span>
                </div> -->

                
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCi1fyYVp1X41gB0H1YI9JfunLIj2hnAJs",
            authDomain: "login-auth-d6a48.firebaseapp.com",
            projectId: "login-auth-d6a48",
            storageBucket: "login-auth-d6a48.firebasestorage.app",
            messagingSenderId: "28705543487",
            appId: "1:28705543487:web:c63037013ccc8edf72ef8a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Redirect to profile if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'profile.html';
            }
        });

        // Functionality to toggle password visibility
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('password-toggle');

            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                passwordToggle.classList.toggle('fa-eye');
                passwordToggle.classList.toggle('fa-eye-slash');
            });

            // Firebase form submission
            const form = document.getElementById('signin-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    // Redirect to profile page
                    window.location.href = 'profile.html';
                } catch (error) {
                    alert('Login failed: ' + error.message);
                }
            });
        });
    </script>
</body>
</html>
