<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Add FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Add Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            overflow: hidden;
        }

        /* Page Wrapper */
        .page-wrapper {
            width: 100vw;
            height: 100vh;
        }

        /* Content Wrapper */
        .content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Card Style */
        .form-card {
            background: linear-gradient(135deg, rgba(230, 245, 255, 0.6) 0%, rgba(255, 255, 255, 0.7) 30%, rgba(255, 245, 255, 0.6) 100%);
            backdrop-filter: blur(25px) saturate(180%);
            border-radius: 24px;
            width: 420px;
            max-width: 100%;
            padding: 40px 35px;
            box-shadow: 0 15px 30px rgba(100, 200, 255, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            text-align: center;
        }

        .form-card::after {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: linear-gradient(135deg, #e6f5ff 0%, #fff 50%, #fff5ff 100%);
            border-radius: 35px;
            filter: blur(40px);
            opacity: 0.5;
            z-index: -1;
        }

        .header-icon {
            font-size: 36px;
            color: #000;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
            max-width: 90%;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
            font-size: 16px;
        }

        .prefix-icon {
            left: 18px;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 14px;
            color: #333;
            background-color: rgba(245, 245, 245, 0.7);
            transition: border-color 0.3s, background-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #5eacff;
            background-color: #fff;
        }

        input::placeholder {
            color: #aaa;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1f2a3c 0%, #151e2b 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #2a384f 0%, #1a2536 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 5px;
        }

        .back-link a {
            font-size: 13px;
            color: #5eacff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #007bff;
        }

        /* Success Message Container */
        .success-message {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .success-icon {
            font-size: 48px;
            color: #28a745;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <main class="content-wrapper">
            <div class="form-card">
                
                <!-- Initial Form View -->
                <div id="form-view" style="width: 100%;">
                    <div class="header-icon">
                        <i class="fas fa-unlock-alt"></i>
                    </div>
                    <h1 class="card-title">Reset Password</h1>
                    <p class="card-description">Enter your email address and we'll send you a link to reset your password.</p>
                    
                    <form id="forgot-form">
                        <div class="input-group">
                            <i class="fas fa-envelope input-icon prefix-icon"></i>
                            <input type="email" id="email" placeholder="Email Address" required>
                        </div>
                        <button type="submit" class="submit-btn" id="submit-btn">
                            <span id="btn-text">Send Reset Link</span>
                            <div class="spinner" id="spinner"></div>
                        </button>
                    </form>

                    <div class="back-link">
                        <a href="login.html"><i class="fas fa-arrow-left"></i> Back to sign in</a>
                    </div>
                </div>

                <!-- Success View (Hidden Initially) -->
                <div id="success-view" class="success-message" style="width: 100%;">
                    <i class="fas fa-check-circle success-icon"></i>
                    <h1 class="card-title">Check your email</h1>
                    <p class="card-description">If an account exists for <strong id="submitted-email"></strong>, we've sent an email with instructions to reset your password.</p>
                    <div class="back-link" style="margin-top: 15px;">
                        <a href="login.html">Return to sign in</a>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCi1fyYVp1X41gB0H1YI9JfunLIj2hnAJs",
            authDomain: "login-auth-d6a48.firebaseapp.com",
            projectId: "login-auth-d6a48",
            storageBucket: "login-auth-d6a48.firebasestorage.app",
            messagingSenderId: "28705543487",
            appId: "1:28705543487:web:c63037013ccc8edf72ef8a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgot-form');
            const formView = document.getElementById('form-view');
            const successView = document.getElementById('success-view');
            const emailInput = document.getElementById('email');
            const submittedEmail = document.getElementById('submitted-email');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                btnText.style.display = 'none';
                spinner.style.display = 'block';
                submitBtn.disabled = true;
                submitBtn.style.cursor = 'not-allowed';

                const email = emailInput.value;

                try {
                    await sendPasswordResetEmail(auth, email);
                    // Update email text
                    submittedEmail.textContent = email;
                    // Hide form and show success state
                    formView.style.display = 'none';
                    successView.style.display = 'flex';
                } catch (error) {
                    alert('Error: ' + error.message);
                    // Reset UI
                    btnText.style.display = 'inline';
                    spinner.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.style.cursor = 'pointer';
                }
            });
        });
    </script>
</body>
</html>
